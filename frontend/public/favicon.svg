<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Background with Deep Teal -->
  <rect width="64" height="64" rx="14" fill="#0F766E" />
  
  <!-- Outer Ring Accent -->
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- The Light of Learning: Beacon / Radiant Sun of Knowledge (கற்றொளி) -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Cardinal Rays -->
    <line x1="32" y1="12" x2="32" y2="18" />
    <line x1="32" y1="46" x2="32" y2="52" />
    <line x1="12" y1="32" x2="18" y2="32" />
    <line x1="46" y1="32" x2="52" y2="32" />
    
    <!-- Diagonal Rays -->
    <line x1="18" y1="18" x2="23" y2="23" stroke-width="3" />
    <line x1="41" y1="41" x2="46" y2="46" stroke-width="3" />
    <line x1="18" y1="46" x2="23" y2="41" stroke-width="3" />
    <line x1="41" y1="23" x2="46" y2="18" stroke-width="3" />
  </g>
  
  <!-- Central Radiant Core -->
  <circle cx="32" cy="32" r="7.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="4" fill="#0F766E" />
</svg>
